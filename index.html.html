<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VibeCheck – Song & Caption AI</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c26;
    --accent: #ff3cac; --accent2: #784ba0; --accent3: #2b86c5;
    --neon: #00f5ff; --gold: #ffd700; --text: #f0f0f8; --muted: #7a7a9a;
    --border: rgba(255,255,255,0.07);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; overflow-x:hidden; }
  body::before { content:''; position:fixed; inset:0;
    background: radial-gradient(ellipse 60% 50% at 20% 10%, rgba(255,60,172,.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 80% 90%, rgba(43,134,197,.12) 0%, transparent 60%),
                radial-gradient(ellipse 40% 30% at 60% 40%, rgba(120,75,160,.08) 0%, transparent 50%);
    pointer-events:none; z-index:0; }
  .container { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:20px; }
  header { text-align:center; padding:40px 0 30px; }
  .logo { font-family:'Bebas Neue',cursive; font-size:clamp(52px,10vw,88px); letter-spacing:4px;
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 40%,var(--accent3) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
  .tagline { font-family:'Space Mono',monospace; font-size:12px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; margin-top:8px; }

  .section-label { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }

  /* Vibe buttons */
  .flex-wrap { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
  .vibe-btn { padding:10px 20px; border-radius:100px; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:7px; user-select:none; }
  .vibe-btn:hover { border-color:rgba(255,60,172,.4); color:var(--text); transform:translateY(-1px); }
  .vibe-btn.active { background:linear-gradient(135deg,rgba(255,60,172,.2),rgba(120,75,160,.2)); border-color:var(--accent); color:var(--text); box-shadow:0 0 16px rgba(255,60,172,.25); }

  /* Language buttons */
  .lang-btn { padding:12px 18px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; transition:all .22s; display:flex; align-items:center; gap:8px; user-select:none; }
  .lang-btn .flag { font-size:20px; line-height:1; }
  .lang-btn:hover { border-color:rgba(0,245,255,.45); color:var(--text); transform:translateY(-2px); }
  .lang-btn.active { background:linear-gradient(135deg,rgba(0,245,255,.12),rgba(43,134,197,.18)); border-color:var(--neon); color:var(--text); box-shadow:0 0 18px rgba(0,245,255,.2); }
  .lang-btn[data-lang="mix"] { border-style:dashed; }
  .lang-btn[data-lang="mix"].active { background:linear-gradient(135deg,rgba(255,60,172,.15),rgba(0,245,255,.15),rgba(255,215,0,.1)); border-color:var(--gold); border-style:solid; box-shadow:0 0 18px rgba(255,215,0,.2); }
  .mix-label { background:linear-gradient(90deg,var(--accent),var(--neon),var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; font-weight:700; }

  /* Upload */
  .upload-zone { border:2px dashed var(--border); border-radius:20px; background:var(--surface); padding:50px 30px; text-align:center; cursor:pointer; transition:all .3s; position:relative; overflow:hidden; margin-bottom:28px; }
  .upload-zone::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,60,172,.05),rgba(43,134,197,.05)); opacity:0; transition:opacity .3s; }
  .upload-zone:hover::before, .upload-zone.drag-over::before { opacity:1; }
  .upload-zone:hover, .upload-zone.drag-over { border-color:rgba(255,60,172,.5); transform:translateY(-2px); }
  .upload-zone input { display:none; }
  .upload-icon { font-size:48px; margin-bottom:12px; display:block; filter:drop-shadow(0 0 20px rgba(255,60,172,.4)); }
  .upload-title { font-size:18px; font-weight:600; margin-bottom:6px; }
  .upload-sub { font-size:13px; color:var(--muted); }
  .preview-wrap { border-radius:20px; overflow:hidden; margin-bottom:28px; position:relative; background:var(--surface); display:none; }
  .preview-wrap.visible { display:block; }
  #preview-img { width:100%; max-height:380px; object-fit:cover; display:block; }
  .change-btn { position:absolute; top:14px; right:14px; padding:7px 16px; border-radius:100px; background:rgba(10,10,15,.7); border:1px solid var(--border); color:var(--text); font-size:12px; cursor:pointer; backdrop-filter:blur(8px); font-family:'DM Sans',sans-serif; transition:all .2s; }
  .change-btn:hover { background:rgba(255,60,172,.2); border-color:var(--accent); }

  /* Type */
  .type-row { display:flex; gap:10px; margin-bottom:28px; }
  .type-btn { flex:1; padding:14px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); color:var(--muted); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; text-align:center; transition:all .2s; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .type-btn span:first-child { font-size:22px; }
  .type-btn:hover { border-color:rgba(255,60,172,.4); color:var(--text); }
  .type-btn.active { border-color:var(--accent); background:rgba(255,60,172,.1); color:var(--text); }

  /* Generate */
  .gen-btn { width:100%; padding:18px; border-radius:14px; border:none; background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3)); color:#fff; font-family:'Bebas Neue',cursive; font-size:22px; letter-spacing:3px; cursor:pointer; position:relative; overflow:hidden; transition:all .3s; margin-bottom:30px; }
  .gen-btn::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,var(--accent3),var(--accent2),var(--accent)); opacity:0; transition:opacity .3s; }
  .gen-btn:hover::before { opacity:1; }
  .gen-btn:hover { transform:translateY(-2px); box-shadow:0 8px 30px rgba(255,60,172,.4); }
  .gen-btn span { position:relative; z-index:1; }

  /* Loading */
  .loading { display:none; text-align:center; padding:40px; }
  .loading.visible { display:block; }
  .spinner { width:48px; height:48px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 16px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-family:'Space Mono',monospace; font-size:12px; color:var(--muted); letter-spacing:2px; }

  /* Results */
  .results { display:none; }
  .results.visible { display:block; }
  .result-header { font-family:'Bebas Neue',cursive; font-size:32px; letter-spacing:2px; margin-bottom:20px; background:linear-gradient(135deg,var(--neon),var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .lang-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 14px; border-radius:100px; font-size:12px; font-family:'Space Mono',monospace; background:rgba(0,245,255,.08); border:1px solid rgba(0,245,255,.25); color:var(--neon); margin-bottom:20px; }

  /* Songs */
  .songs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-bottom:28px; }
  .song-card { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:16px; cursor:pointer; transition:all .25s; position:relative; overflow:hidden; }
  .song-card::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,rgba(255,60,172,.08),rgba(43,134,197,.08)); opacity:0; transition:opacity .25s; }
  .song-card:hover::before { opacity:1; }
  .song-card:hover { border-color:rgba(255,60,172,.4); transform:translateY(-3px); box-shadow:0 10px 30px rgba(0,0,0,.3); }
  .song-card.selected { border-color:var(--accent); background:rgba(255,60,172,.1); }
  .song-meta { display:flex; align-items:flex-start; gap:12px; position:relative; z-index:1; }
  .song-emoji { font-size:30px; flex-shrink:0; }
  .song-title { font-weight:600; font-size:15px; margin-bottom:3px; }
  .song-artist { font-size:12px; color:var(--muted); }
  .song-lang-pill { display:inline-block; font-size:9px; padding:2px 7px; border-radius:100px; background:rgba(255,215,0,.1); border:1px solid rgba(255,215,0,.3); color:var(--gold); font-family:'Space Mono',monospace; margin-top:5px; }

  /* Captions */
  .captions-list { display:flex; flex-direction:column; gap:12px; margin-bottom:28px; }
  .caption-card { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:16px 18px; cursor:pointer; transition:all .25s; position:relative; }
  .caption-card:hover { border-color:rgba(43,134,197,.5); background:var(--surface2); transform:translateX(4px); }
  .caption-card.selected { border-color:var(--neon); background:rgba(0,245,255,.05); }
  .caption-text { font-size:15px; line-height:1.6; margin-bottom:8px; }
  .caption-hashtags { font-size:12px; color:var(--accent3); font-weight:500; }
  .copy-hint { position:absolute; bottom:12px; right:14px; font-size:11px; color:var(--muted); opacity:0; transition:opacity .2s; font-family:'Space Mono',monospace; }
  .caption-card:hover .copy-hint { opacity:1; }

  /* Toast */
  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--surface2); border:1px solid var(--accent); border-radius:100px; padding:12px 24px; font-size:14px; font-weight:500; z-index:999; transition:transform .3s cubic-bezier(.34,1.56,.64,1); box-shadow:0 8px 30px rgba(255,60,172,.2); white-space:nowrap; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .regen-btn { width:100%; padding:14px; border-radius:12px; border:1.5px solid var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; transition:all .2s; margin-bottom:40px; }
  .regen-btn:hover { border-color:var(--accent); color:var(--text); }
  .divider { height:1px; background:var(--border); margin:24px 0; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  .animate-in { animation:fadeUp .4s ease forwards; opacity:0; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">VibeCheck</div>
    <div class="tagline">AI Song & Caption Suggester for Instagram</div>
  </header>

  <div class="section-label">① Choose Your Vibe</div>

    <button class="vibe-btn" data-vibe="attitude">😤 Attitude</button>
    <button class="vibe-btn" data-vibe="happy">🌟 Happy</button>

    <button class="vibe-btn" data-vibe="boss">💼 Boss Mode</button>

  <div class="section-label">② Choose Language</div>
  <div class="flex-wrap" id="langs">
    <button class="lang-btn active" data-lang="hindi"><span class="flag">🇮🇳</span> Hindi</button>
    <button class="lang-btn" data-lang="english"><span class="flag">🇬🇧</span> English</button>
    <button class="lang-btn" data-lang="marathi"><span class="flag">🧡</span> Marathi</button>

  <div class="section-label">③ Content Type</div>
  <div class="type-row">

  </div>

  <div class="section-label">④ Upload Photo / Video (Optional)</div>
  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept="image/*,video/*">
    <span class="upload-icon">📤</span>
    <div class="upload-title">Drop your photo or video here</div>
    <div class="upload-sub">or click to browse · JPG, PNG, MP4, MOV</div>
  </div>
  <div class="preview-wrap" id="preview-wrap">
    <img id="preview-img" src="" alt="Preview">
    <button class="change-btn" id="change-btn">Change ✕</button>
  </div>

  <button class="gen-btn" id="gen-btn"><span>✨ Generate My Vibe</span></button>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">ANALYZING YOUR VIBE...</div>
  </div>

  <div class="results" id="results">
    <div class="lang-badge" id="lang-badge">🇮🇳 Hindi</div>
    <div class="result-header">🎵 Perfect Songs For You</div>
    <div class="songs-grid" id="songs-grid"></div>
    <div class="divider"></div>
    <div class="result-header">✍️ Caption Ideas</div>
    <div class="captions-list" id="captions-list"></div>
    <button class="regen-btn" id="regen-btn">🔄 Regenerate Suggestions</button>
  </div>
</div>
<div class="toast" id="toast">📋 Copied!</div>

const langLabels = { hindi:'🇮🇳 Hindi', english:'🇬🇧 English', marathi:'🧡 Marathi', south:'🌴 South (Tamil/Telugu)', punjabi:'💛 Punjabi', mix:'🎨 MIX – All Languages' };
let selectedVibe = 'romantic', selectedLang = 'hindi', selectedType = 'story';

document.querySelectorAll('.vibe-btn').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.vibe-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); selectedVibe = b.dataset.vibe; }));
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.lang-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); selectedLang = b.dataset.lang; }));
document.querySelectorAll('.type-btn').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.type-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); selectedType = b.dataset.type; }));

const uploadZone=document.getElementById('upload-zone'), fileInput=document.getElementById('file-input'), previewWrap=document.getElementById('preview-wrap'), previewImg=document.getElementById('preview-img');
uploadZone.addEventListener('click', ()=>fileInput.click());
uploadZone.addEventListener('dragover', e=>{e.preventDefault();uploadZone.classList.add('drag-over');});
uploadZone.addEventListener('dragleave', ()=>uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e=>{e.preventDefault();uploadZone.classList.remove('drag-over');if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change', ()=>{if(fileInput.files[0])handleFile(fileInput.files[0]);});
function handleFile(file){const r=new FileReader();r.onload=e=>{if(file.type.startsWith('image/')){previewImg.src=e.target.result;previewImg.style.display='block';}else previewImg.style.display='none';previewWrap.classList.add('visible');uploadZone.style.display='none';};r.readAsDataURL(file);}
document.getElementById('change-btn').addEventListener('click', ()=>{previewWrap.classList.remove('visible');uploadZone.style.display='';fileInput.value='';});

document.getElementById('gen-btn').addEventListener('click', generate);
document.getElementById('regen-btn').addEventListener('click', generate);
const loadingTexts=["ANALYZING YOUR VIBE...","READING THE ENERGY...","CURATING PERFECT SONGS...","CRAFTING YOUR CAPTIONS...","ALMOST THERE..."];
function generate(){const loading=document.getElementById('loading'),results=document.getElementById('results'),lt=document.getElementById('loading-text');results.classList.remove('visible');loading.classList.add('visible');let i=0;const iv=setInterval(()=>{lt.textContent=loadingTexts[i++%loadingTexts.length];},400);setTimeout(()=>{clearInterval(iv);loading.classList.remove('visible');renderResults();},2000);}

function getData(vibe,lang){const v=db[vibe];if(!v)return{songs:[],captions:[]};if(lang==='mix'){const all=['hindi','english','marathi','south','punjabi'];let songs=[],captions=[];all.forEach(l=>{if(v[l]){songs.push(...v[l].songs);captions.push(...v[l].captions);}});return{songs,captions};}return v[lang]||{songs:[],captions:[]};}

function renderResults(){const data=getData(selectedVibe,selectedLang);const sg=document.getElementById('songs-grid'),cl=document.getElementById('captions-list'),results=document.getElementById('results'),badge=document.getElementById('lang-badge');
  badge.textContent=langLabels[selectedLang];
  if(selectedLang==='mix'){badge.style.cssText='background:linear-gradient(90deg,rgba(255,60,172,.15),rgba(0,245,255,.15),rgba(255,215,0,.12));border-color:rgba(255,215,0,.4);color:#ffd700;';}else{badge.style.cssText='';}
  const songs=[...data.songs].sort(()=>Math.random()-.5).slice(0,selectedLang==='mix'?6:4);
  const captions=[...data.captions].sort(()=>Math.random()-.5).slice(0,4);
  sg.innerHTML=songs.map((s,i)=>`<div class="song-card animate-in" style="animation-delay:${i*.07}s" onclick="selectSong(this,'${s.title.replace(/'/g,"&#39;")} – ${s.artist.replace(/'/g,"&#39;")}')"><div class="song-meta"><span class="song-emoji">${s.emoji}</span><div><div class="song-title">${s.title}</div><div class="song-artist">${s.artist}</div>${s.lang?`<span class="song-lang-pill">${s.lang}</span>`:''}</div></div></div>`).join('');
  cl.innerHTML=captions.map((c,i)=>`<div class="caption-card animate-in" style="animation-delay:${i*.07}s" onclick="copyCaption(this,'${encodeURIComponent(c.text+'\\n'+c.tags)}')"><div class="caption-text">${c.text}</div><div class="caption-hashtags">${c.tags}</div><span class="copy-hint">tap to copy ✓</span></div>`).join('');
  results.classList.add('visible');results.scrollIntoView({behavior:'smooth',block:'start'});}

function selectSong(el,text){document.querySelectorAll('.song-card').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');showToast('🎵 Song selected!');}
function copyCaption(el,encoded){document.querySelectorAll('.caption-card').forEach(c=>c.classList.remove('selected'));el.classList.add('selected');try{navigator.clipboard.writeText(decodeURIComponent(encoded));}catch(e){}showToast('📋 Caption copied to clipboard!');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
</script>
</body>
</html>
